name: Pool Janitor

# Manual maintenance for licenses.json on the `state` branch.
# - audit:   report every seat, incl. live status of the run holding it
# - sweep:   free reserved seats whose holding run has finished (or, without
#            a runs token, whose reservation has expired)
# - unblock: set one blocked seat back to available (after Unity ID dashboard cleanup)
# - free:    force-free one seat (refuses seats held by a confirmed-live run unless force)
#
# Pool writes use this workflow's own GITHUB_TOKEN. Live run-status checks
# need the optional INDUS_RUNS_TOKEN secret: a fine-grained PAT with only
# "Actions: read" on JuneSoftware/Indus-03. Without it, audit shows run
# state as "unknown" and sweep falls back to expiry-based cleanup.
#
# NOTE: freeing a seat here cannot return the Unity-side activation - that
# lives on the runner machine (see the residue warnings in the output). The
# v2.0.1 machine sweep returns it when that runner takes its next job;
# otherwise remove it in the Unity ID dashboard.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        type: choice
        options:
          - audit
          - sweep
          - unblock
          - free
      seat:
        description: Seat id (or unique prefix) - required for unblock/free
        required: false
        type: string
      force:
        description: free only - also free a seat whose run is confirmed still running
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  janitor:
    runs-on: ubuntu-latest
    steps:
      - name: Run janitor
        uses: actions/github-script@v7
        env:
          POOL_ACTION: ${{ inputs.action }}
          POOL_SEAT: ${{ inputs.seat }}
          POOL_FORCE: ${{ inputs.force }}
          INDUS_RUNS_TOKEN: ${{ secrets.INDUS_RUNS_TOKEN }}
        with:
          script: |
            const BRANCH = 'state';
            const FILE = 'licenses.json';
            const { owner, repo } = context.repo;
            const action = process.env.POOL_ACTION;
            const seatArg = (process.env.POOL_SEAT || '').trim();
            const force = process.env.POOL_FORCE === 'true';
            const runsToken = process.env.INDUS_RUNS_TOKEN || '';

            const mask = s => `${String(s).substring(0, 7)}-****`;

            async function readPool() {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: FILE, ref: BRANCH });
              return { entries: JSON.parse(Buffer.from(data.content, 'base64').toString('utf8')), sha: data.sha };
            }

            async function writePool(entries, sha, message) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path: FILE, branch: BRANCH, sha, message,
                content: Buffer.from(JSON.stringify(entries, null, 2)).toString('base64')
              });
            }

            function freeSeat(e) {
              e.status = 'available';
              e.expiresAt = null;
              e.reservedBy = null;
              e.machine = null;
              e.machineRun = null;
            }

            // reservedBy format: owner/repo/run_id -> 'in_progress' | 'finished' | 'unknown'
            async function runState(reservedBy) {
              if (!runsToken || !reservedBy) return 'unknown';
              const parts = reservedBy.split('/');
              if (parts.length !== 3) return 'unknown';
              const res = await fetch(`https://api.github.com/repos/${parts[0]}/${parts[1]}/actions/runs/${parts[2]}`, {
                headers: { Authorization: `Bearer ${runsToken}`, Accept: 'application/vnd.github+json' }
              });
              if (res.status === 404) return 'finished'; // run older than retention
              if (!res.ok) { core.warning(`Run lookup failed: HTTP ${res.status}`); return 'unknown'; }
              const run = await res.json();
              return run.status === 'completed' ? 'finished' : 'in_progress';
            }

            function residueWarning(e) {
              core.warning(`Seat ${e.id} (serial ${mask(e.serialId)}) freed in the pool, but its Unity activation may still be held on '${e.machine || 'unknown machine'}'. It self-heals on that runner's next job (v2.0.1 sweep) or remove it at id.unity.com > My Account > My Seats.`);
            }

            function findSeat(entries) {
              if (!seatArg) throw new Error(`'seat' input is required for ${action}`);
              const matches = entries.filter(e => e.id === seatArg || e.id.startsWith(seatArg));
              if (matches.length !== 1) throw new Error(`Seat '${seatArg}' matched ${matches.length} entries; need exactly 1`);
              return matches[0];
            }

            for (let attempt = 0; attempt < 5; attempt++) {
              const { entries, sha } = await readPool();
              const now = new Date();
              let message = null;

              if (action === 'audit' || action === 'sweep') {
                const rows = [];
                const toFree = [];
                for (const e of entries) {
                  let state = '';
                  if (e.status === 'reserved') {
                    state = await runState(e.reservedBy);
                    const expired = e.expiresAt && new Date(e.expiresAt) <= now;
                    const stale = state === 'finished' || (state === 'unknown' && expired);
                    if (stale) toFree.push(e);
                    state += expired ? ' (expired)' : '';
                  }
                  rows.push([e.id.substring(0, 12), e.game, e.status, e.reservedBy || '-', state || '-', e.expiresAt || '-', e.machine || '-', (e.blockedReason || '-').substring(0, 60)]);
                }
                await core.summary
                  .addHeading(`Licence pool - ${action} (${entries.length} seats, ${toFree.length} stale)`)
                  .addTable([
                    [{ data: 'seat', header: true }, { data: 'game', header: true }, { data: 'status', header: true }, { data: 'held by', header: true }, { data: 'run state', header: true }, { data: 'expires', header: true }, { data: 'machine', header: true }, { data: 'blocked reason', header: true }],
                    ...rows
                  ])
                  .addRaw(runsToken ? '' : '\n\nNo INDUS_RUNS_TOKEN secret - run states unknown; sweep uses expiry only.')
                  .write();

                if (action === 'audit' || toFree.length === 0) {
                  console.log(`${action}: nothing to change (${toFree.length} stale found)`);
                  return;
                }
                for (const e of toFree) { residueWarning(e); freeSeat(e); }
                message = `janitor: sweep ${toFree.length} stale seat(s)`;
              }

              if (action === 'unblock') {
                const seat = findSeat(entries);
                if (seat.status !== 'blocked') throw new Error(`Seat ${seat.id} is '${seat.status}', not 'blocked'`);
                freeSeat(seat);
                delete seat.blockedReason;
                console.log(`Unblocked ${seat.id} (serial ${mask(seat.serialId)})`);
                message = `janitor: unblock ${seat.id}`;
              }

              if (action === 'free') {
                const seat = findSeat(entries);
                if (seat.status === 'available') { console.log(`Seat ${seat.id} is already available`); return; }
                const state = await runState(seat.reservedBy);
                if (state === 'in_progress' && !force) {
                  throw new Error(`Seat ${seat.id} is held by a RUNNING build (${seat.reservedBy}). Re-run with force=true if you are sure.`);
                }
                residueWarning(seat);
                freeSeat(seat);
                delete seat.blockedReason;
                message = `janitor: force-free ${seat.id}`;
              }

              try {
                await writePool(entries, sha, `${message} [${context.actor}]`);
                console.log(`Done: ${message}`);
                return;
              } catch (error) {
                if (error.status === 409 || error.status === 422) {
                  console.log('Lost a write race with a build; retrying');
                  await new Promise(r => setTimeout(r, 5000));
                  continue;
                }
                throw error;
              }
            }
            throw new Error('Gave up after 5 write conflicts; try again in a quiet moment');
